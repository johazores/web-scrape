name: Bug report
description: Report a reproducible crawler or export problem
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remove credentials, private URLs, and copied private content.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Sanitized configuration
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction
      description: Use a local fixture or a website you are authorized to crawl.
    validations:
      required: true
